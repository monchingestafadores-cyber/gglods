<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Scoreboard</title>
  <link rel="stylesheet" href="teacher-scoreboard.css?v=2" />
</head>
<body>
  <main class="scoreboard-shell">
    <header class="scoreboard-header">
      <div>
        <p class="eyebrow">Metaphoria Classroom</p>
        <h1>Teacher Scoreboard</h1>
      </div>
      <div class="room-control">
        <label for="roomInput">Room</label>
        <div>
          <input id="roomInput" maxlength="16" value="CLASS" />
          <button id="roomButton" type="button">Open</button>
        </div>
      </div>
    </header>

    <section class="join-card">
      <div>
        <span>Student Link</span>
        <strong id="studentLink">Loading...</strong>
      </div>
      <button id="copyLinkButton" type="button">Copy</button>
    </section>

    <section class="score-grid" aria-live="polite">
      <div class="score-panel">
        <div class="panel-heading">
          <h2>Live Student Scores</h2>
          <span id="liveCount">0 live</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Score</th>
                <th>Game</th>
                <th>Level</th>
                <th>Streak</th>
                <th>Hints</th>
                <th>Badges</th>
              </tr>
            </thead>
            <tbody id="liveRows">
              <tr><td colspan="8">Waiting for students...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="score-panel">
        <div class="panel-heading">
          <h2>Scores to Beat</h2>
          <span id="topCount">Top 0</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Best</th>
                <th>Game</th>
                <th>Level</th>
                <th>Badges</th>
              </tr>
            </thead>
            <tbody id="topRows">
              <tr><td colspan="6">No scores yet.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <footer class="scoreboard-footer">
      <span id="connectionStatus">Connecting...</span>
      <span id="lastUpdated">Last update: --</span>
    </footer>
  </main>

  <script src="teacher-scoreboard.js?v=4"></script>
</body>
</html>
